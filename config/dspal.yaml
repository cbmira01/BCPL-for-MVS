      RANDOM: library/random.bcpl
      STRUTIL: library/string-utils.bcpl

  BCPLDEMO:
    dsn: BCPL.BCPLDEMO
    description: Complete readable BCPL demonstration programs
    type: pds
    dsorg: PO
    recfm: FB
    lrecl: 80
    blksize: 800
    populate: true
    members:
      RFACT: suite/richards-factorial/richards-factorial.bcpl
      QUEENS: suite/queens/queens.bcpl
      KNIGHT: suite/knight/knight.bcpl
      HANOI: suite/hanoi/hanoi.bcpl
      SIEVE: suite/sieve/sieve.bcpl
      GCD: suite/gcd/gcd.bcpl
