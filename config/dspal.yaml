version: 1

mvs:
  userid: HERC02
  batch_user: HERC02
  batch_password: null
  hlq: HERC02
  default_unit: SYSDA
  default_volume: null
  write_boundary: HERC02.**

runtime:
  docker_container: mvs38j
  reader_host: 127.0.0.1
  reader_port: 3505
  hercules_host: 127.0.0.1
  hercules_port: 8038
  printer: mvs-state/prt/prt00e.txt
  submit_timeout: 120
  completion_timeout: 120

text:
  host_encoding: utf-8
  mvs_encoding: cp037
  conversion_errors: strict
  output_line_endings: lf
  strip_trailing_blanks: true

allocation_defaults:
  space_unit: TRK
  primary: 10
  secondary: 5
  directory: 20

# Explicit repo-to-member mappings are authoritative.  PDS members are not
# inferred by truncating host filenames.  Datasets without members mappings
# remain managed/allocatable but are not populated until their flattening
# policy is explicitly defined.
datasets:
  SOURCE:
    dsn: BCPL.SOURCE
    description: BCPL compiler and program source library
    type: pds
    dsorg: PO
    recfm: FB
    lrecl: 80
    blksize: 800
    populate: true

  ASM:
    dsn: BCPL.ASM
    description: System/370 assembler source library
    type: pds
    dsorg: PO
    recfm: FB
    lrecl: 80
    blksize: 800
    populate: true
    members:
      HELLOWLD: asm/hello-world.asm
      ICINT12: asm/icintv12.asm
      ICINT13: asm/icintv13.asm
      IC14TRCE: asm/icintv14-trace.asm
      ICINT14: asm/icintv14.asm
      ICINT15: asm/icintv15.asm
      ICINT16: asm/icintv16.asm
      ICINT17: asm/icintv17.asm

  JCL:
    dsn: BCPL.JCL
    description: Reusable MVS JCL library
    type: pds
    dsorg: PO
    recfm: FB
    lrecl: 80
    blksize: 800
    populate: true
    members:
      DUMPJES: jcl/dump-jes2-parameters.jcl
      HELLOHVY: jcl/hello-world-heavy.jcl
      IC12HON: jcl/icintv12-honors-thesis.jcl
      IC13HON: jcl/icintv13-honors-thesis.jcl
      IC13MAP: jcl/icintv13-mapstore.jcl
      LSTPARM: jcl/list-parmlib-members.jcl

  INTCODE:
    dsn: BCPL.INTCODE
    description: INTCODE programs, compiler phases, and interpreter inputs
    type: pds
    dsorg: PO
    recfm: FB
    lrecl: 80
    blksize: 800
    populate: true
    members:
      BLIBI: intcode/blibi.int
      CGI: intcode/cgi.int
      ICLIB: intcode/iclib.int
      SYNI: intcode/syni.int
      TRNI: intcode/trni.int

  LIBRARY:
    dsn: BCPL.LIBRARY
    description: Reusable BCPL runtime and library source
    type: pds
    dsorg: PO
    recfm: FB
    lrecl: 80
    blksize: 800
    populate: true
    members:
      CHARUTIL: library/char-utils.bcpl
      COROUTIN: library/coroutines.bcpl
      GETVEC: library/getvec-freevec.bcpl
      INTUTIL: library/integer-utils.bcpl
      LINEIO: library/line-io.bcpl
      MEMUTIL: library/memory-utils.bcpl
      NUMCONV: library/numeric-conversion.bcpl
      RANDOM: library/random.bcpl
      STRUTIL: library/string-utils.bcpl

  BCPLDEMO:
    dsn: BCPL.BCPLDEMO
    description: BCPL demonstration programs
    type: pds
    dsorg: PO
    recfm: FB
    lrecl: 80
    blksize: 800
    populate: true

  LANGDEMO:
    dsn: BCPL.LANGDEMO
    description: BCPL language-feature demonstration programs
    type: pds
    dsorg: PO
    recfm: FB
    lrecl: 80
    blksize: 800
    populate: true

  REGRESS:
    dsn: BCPL.REGRESS
    description: Permanent BCPL regression programs and fixtures
    type: pds
    dsorg: PO
    recfm: FB
    lrecl: 80
    blksize: 800
    populate: true

  TEST:
    dsn: BCPL.TEST
    description: Ad hoc and current BCPL test programs and fixtures
    type: pds
    dsorg: PO
    recfm: FB
    lrecl: 80
    blksize: 800
    populate: true

  LOAD:
    dsn: BCPL.LOAD
    description: Link-edited executable load modules
    type: loadlib
    dsorg: PO
    recfm: U
    lrecl: 0
    blksize: 6144
    populate: false
