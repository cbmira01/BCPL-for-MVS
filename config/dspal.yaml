  LANGDEMO:
    dsn: BCPL.LANGDEMO
    description: Focused BCPL language-feature demonstration programs
    type: pds
    dsorg: PO
    recfm: FB
    lrecl: 80
    blksize: 800
    populate: true
    members:
      BOOLOPS: suite/language/boolean-operators/boolean-operators.bcpl
      DECLS: suite/language/declarations/declarations.bcpl
      FUNCVAL: suite/language/function-values/function-values.bcpl
      MANIGLOB: suite/language/manifest-global/manifest-global.bcpl
      PTRIDIOM: suite/language/pointer-idioms/pointer-idioms.bcpl
      REPEAT: suite/language/repeat-forms/repeat-forms.bcpl
      STRBYTES: suite/language/strings-bytes/strings-bytes.bcpl
      SWITCHON: suite/language/switchon/switchon.bcpl
      TABVECT: suite/language/table-vector/table-vector.bcpl
      TESTTHEN: suite/language/test-then-or/test-then-or.bcpl
      VALOFRES: suite/language/valof-resultis/valof-resultis.bcpl

  REGRESS:
    dsn: BCPL.REGRESS
    description: Permanent BCPL regression panel programs and fixtures
    type: pds
    dsorg: PO
    recfm: FB
