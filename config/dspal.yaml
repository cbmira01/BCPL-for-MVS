version: 1

mvs:
  userid: HERC02
  batch_user: HERC02
  batch_password: null
  hlq: HERC02
  default_unit: SYSDA
  default_volume: null
  write_boundary: HERC02.**

runtime:
  docker_container: mvs38j
  reader_host: 127.0.0.1
  reader_port: 3505
  hercules_host: 127.0.0.1
  hercules_port: 8038
  printer: mvs-state/prt/prt00e.txt
  submit_timeout: 120
  completion_timeout: 120

text:
  host_encoding: utf-8
  mvs_encoding: cp037
  conversion_errors: strict
  output_line_endings: lf
  strip_trailing_blanks: true

allocation_defaults:
  space_unit: TRK
  primary: 10
  secondary: 5
  directory: 20

# M3 namespace migration: previous HERC02.BCPL.* datasets are not deleted.
# Generated workarea inputs are mapped separately and populated when ready.
# On the first 'populate all', missing generated members are reported as errors
# after available Git-backed members have been installed.
# Object and load libraries require rebuilding after a destructive purge.
datasets:
  MR10_SOURCE:
    dsn: BCPL.MR10KIT.SOURCE
    description: MR10 INTCODE compiler phases and interpreter input
    primary: 15
    secondary: 5
    directory: 5
